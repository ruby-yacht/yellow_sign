<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City</title>
  <style>
    :root { color-scheme: dark; --bg: #101417; --panel: #1c2224; --ink: #edf0e7; --muted: #aab6ad; --accent: #e0ba54; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font: 18px/1.55 Georgia, serif; background: linear-gradient(135deg, #172329, var(--bg) 55%, #241d12); color: var(--ink); display: grid; place-items: center; padding: 24px; }
    main { width: min(760px, 100%); background: color-mix(in srgb, var(--panel), transparent 8%); border: 1px solid #435052; border-radius: 8px; padding: clamp(22px, 5vw, 46px); box-shadow: 0 24px 80px #0009; }
    h1 { margin: 0 0 18px; font-size: clamp(32px, 8vw, 54px); font-weight: 400; color: #f0cf73; }
    p { margin: 0 0 18px; }
    ul { margin: 24px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
    a, button { color: var(--accent); background: none; border: 0; padding: 0; font: inherit; text-decoration-thickness: 1px; cursor: pointer; }
    button:hover, a:hover { color: #ffe08a; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const sharedVariables = ["visitedPark", "visitedObservatory", "visitedMuseum", "visitedBobaShop", "bookRead", "lastLocation"];
    const state = harvestUrlState();
    const app = document.querySelector("#app");

    function harvestUrlState() {
      const params = new URLSearchParams(window.location.search);
      return {
        visitedPark: params.get("visitedPark") === "1",
        visitedObservatory: params.get("visitedObservatory") === "1",
        visitedMuseum: params.get("visitedMuseum") === "1",
        visitedBobaShop: params.get("visitedBobaShop") === "1",
        bookRead: params.get("bookRead") === "1",
        lastLocation: params.get("lastLocation") || "city"
      };
    }

    function storyUrl(target) {
      const params = new URLSearchParams();
      params.set("visitedPark", state.visitedPark ? "1" : "0");
      params.set("visitedObservatory", state.visitedObservatory ? "1" : "0");
      params.set("visitedMuseum", state.visitedMuseum ? "1" : "0");
      params.set("visitedBobaShop", state.visitedBobaShop ? "1" : "0");
      params.set("bookRead", state.bookRead ? "1" : "0");
      params.set("lastLocation", state.lastLocation || "city");
      return target + "?" + params.toString();
    }

    function syncUrl() {
      window.history.replaceState(null, "", storyUrl("city.html"));
    }

    function link(label, passage) {
      return `<li><button type="button" data-passage="${passage}">${label}</button></li>`;
    }

    function render(passage) {
      if (passage === "park") { state.visitedPark = true; state.lastLocation = "park"; }
      if (passage === "observatory") { state.visitedObservatory = true; state.lastLocation = "observatory"; }
      if (passage === "museum") { state.visitedMuseum = true; state.lastLocation = "museum"; }
      if (passage === "bobaShop") { state.visitedBobaShop = true; state.lastLocation = "bobaShop"; }
      if (passage === "returnHome") state.lastLocation = "cityCenter";

      const passages = {
        cityCenter: `<h1>City Center</h1><p>The city center gathers the streets into a bright uneasy knot. From here, every destination seems to know your name.</p>${state.bookRead ? `<p class="muted">The book from home has made the city more legible, though not kinder.</p>` : ""}<ul>${link("Walk to the park", "park")}${link("Climb to the observatory", "observatory")}${link("Enter the museum", "museum")}${link("Visit the boba shop", "bobaShop")}${link("Return home", "returnHome")}</ul>`,
        park: `<h1>Park</h1><p>The park is green in a way that feels theatrical. Paths curve around a dry fountain, and the trees whisper like pages being turned.</p><ul>${link("Back to the city center", "cityCenter")}</ul>`,
        observatory: `<h1>Observatory</h1><p>At the observatory, a brass telescope points at a gap between stars. You look through it and see a window lit inside your own house.</p><ul>${link("Back to the city center", "cityCenter")}</ul>`,
        museum: `<h1>Museum</h1><p>The museum is full of portraits, stage props, and yellowed playbills. One placard is blank except for your reflection.</p><ul>${link("Back to the city center", "cityCenter")}</ul>`,
        bobaShop: `<h1>Boba Shop</h1><p>The boba shop glows with clean tile, soft music, and sealed cups. For a few minutes, the city seems almost ordinary.</p><ul>${link("Back to the city center", "cityCenter")}</ul>`,
        returnHome: `<h1>Return Home</h1><p>The route home folds through side streets and under yellow signs.</p><ul><li><button type="button" data-story-target="home.html">Open the front door</button></li></ul>`
      };

      syncUrl();
      app.innerHTML = passages[passage] || passages.cityCenter;
    }

    app.addEventListener("click", event => {
      const button = event.target.closest("[data-passage]");
      if (button) render(button.dataset.passage);

      const storyTarget = event.target.closest("[data-story-target]");
      if (storyTarget) window.location.href = storyUrl(storyTarget.dataset.storyTarget);
    });

    render("cityCenter");
  </script>
</body>
</html>
